name: Deploy Wazuh Rules via SSH

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Deployment Mode'
        required: true
        default: 'append'
        type: choice
        options:
          - append
          - overwrite
  push:
    branches: [ main ]
    paths:
      - 'rules/local_rules.xml'
      - 'rules/append_rules.xml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WAZUH_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.WAZUH_SSH_PORT || 22 }} ${{ secrets.WAZUH_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Determine Deployment Mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.action_type }}" >> $GITHUB_OUTPUT
          elif git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | grep -q "rules/local_rules.xml"; then
            echo "mode=overwrite" >> $GITHUB_OUTPUT
          else
            echo "mode=append" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Rules
        env:
          SSH_USER: ${{ secrets.WAZUH_SSH_USER }}
          SSH_HOST: ${{ secrets.WAZUH_SSH_HOST }}
          SSH_PORT: ${{ secrets.WAZUH_SSH_PORT || 22 }}
          DEPLOY_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          # Create deployment script
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          MODE="$1"
          TIMESTAMP="$2"
          
          echo "=== Wazuh Rule Deployment (SSH) ==="
          echo "Mode: $MODE"
          echo "Timestamp: $TIMESTAMP"
          
          # Variables
          BACKUP_DIR="/var/ossec/etc/rules_backups"
          TARGET_FILE="/var/ossec/etc/rules/local_rules.xml"
          BACKUP_FILE="$BACKUP_DIR/local_rules_pre_${MODE}_${TIMESTAMP}.xml"
          
          # Rollback function
          rollback() {
            echo "::error::Deployment failed! Rolling back..."
            if [ -f "$BACKUP_FILE" ]; then
              cp -f "$BACKUP_FILE" "$TARGET_FILE"
              systemctl restart wazuh-manager
            fi
            exit 1
          }
          
          # Step 1: Create backup
          echo "Step 1: Creating backup..."
          mkdir -p "$BACKUP_DIR"
          if [ ! -f "$TARGET_FILE" ]; then
            echo '<group name="local,syslog,sshd,"></group>' > "$TARGET_FILE"
          fi
          cp -f "$TARGET_FILE" "$BACKUP_FILE"
          echo "Backup saved: $BACKUP_FILE"
          
          # Step 2: Apply rules
          echo "Step 2: Applying rules ($MODE mode)..."
          if [ "$MODE" = "overwrite" ]; then
            cp -f "/tmp/local_rules.xml" "$TARGET_FILE"
          else
            # Append mode
            CLEAN_APPEND=$(grep -v '<group' /tmp/append_rules.xml | grep -v '</group>' | grep -v '^[[:space:]]*#' || true)
            sed -i '/<\/group>/d' "$TARGET_FILE"
            echo "$CLEAN_APPEND" >> "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
            echo "</group>" >> "$TARGET_FILE"
          fi
          
          # Step 3: Validate rules
          echo "Step 3: Validating rules..."
          if ! /var/ossec/bin/wazuh-analysisd -t 2>/dev/null; then
            echo "Validation failed!"
            rollback
          fi
          echo "Validation successful!"
          
          # Step 4: Restart Wazuh Manager
          echo "Step 4: Restarting Wazuh Manager..."
          if ! systemctl restart wazuh-manager; then
            echo "Restart failed!"
            rollback
          fi
          
          # Step 5: Health check
          echo "Step 5: Health check..."
          sleep 10
          if ! /var/ossec/bin/wazuh-control status | grep -q "running"; then
            echo "Health check failed!"
            rollback
          fi
          
          echo "=== DEPLOYMENT SUCCESSFUL ==="
          EOF
          
          # Make script executable
          chmod +x deploy.sh
          
          # Copy rule files to remote server
          echo "Copying rule files to remote server..."
          scp -P $SSH_PORT -o StrictHostKeyChecking=no \
            rules/local_rules.xml \
            rules/append_rules.xml \
            $SSH_USER@$SSH_HOST:/tmp/
          
          # Execute deployment script on remote server
          echo "Executing deployment script..."
          ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
            "bash -s" < deploy.sh "$DEPLOY_MODE" "$TIMESTAMP"
          
          # Clean up remote temp files
          ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
            "rm -f /tmp/local_rules.xml /tmp/append_rules.xml"
          
          echo "✅ Deployment complete!"

      - name: Archive Backup
        if: success()
        env:
          SSH_USER: ${{ secrets.WAZUH_SSH_USER }}
          SSH_HOST: ${{ secrets.WAZUH_SSH_HOST }}
          SSH_PORT: ${{ secrets.WAZUH_SSH_PORT || 22 }}
          DEPLOY_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          mkdir -p history
          
          # Fetch the deployed backup from server
          scp -P $SSH_PORT -o StrictHostKeyChecking=no \
            $SSH_USER@$SSH_HOST:/var/ossec/etc/rules_backups/local_rules_pre_${DEPLOY_MODE}_${TIMESTAMP}.xml \
            history/ 2>/dev/null || true
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-Archive: ${DEPLOY_MODE}_pre_${TIMESTAMP}.xml [skip ci]"
            git push
            echo "Backup pushed to GitHub history!"
          else
            echo "No new changes to commit"
          fi
