name: Wazuh Pure-API Rule Deployment & Backup

on:
  push:
    branches: [ main ]
    paths:
      - 'rules/**'
  workflow_dispatch:

jobs:
  deploy-rules-via-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate, Backup, Deploy, and Restart via API
        env:
          HOST: ${{ secrets.WAZUH_HOST }}
          API_USER: ${{ secrets.WAZUH_API_USER }}
          API_PASS: ${{ secrets.WAZUH_API_PASS }}
        run: |
          set -e

          echo "=== 1. Authenticating with Wazuh REST API ==="
          TOKEN=$(curl -k -s -X POST "https://${HOST}:55000/security/user/authenticate?raw=true" \
            -u "${API_USER}:${API_PASS}")

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "Unauthorized" ]; then
            echo "::error::Authentication failed! Verify credentials and network access to port 55000."
            exit 1
          fi
          echo "Successfully authenticated. Token generated."

          echo "=== 2. Backing Up Existing Rules via API ==="
          # Fetch the current contents of local_rules.xml from the server
          BACKUP_CONTENT=$(curl -k -s -X GET "https://${HOST}:55000/rules/files/local_rules.xml" \
            -H "Authorization: Bearer ${TOKEN}")

          mkdir -p temp_backup
          echo "$BACKUP_CONTENT" > temp_backup/local_rules_backup.xml
          echo "Current server rules backed up temporarily."

          echo "=== 3. Uploading New Rules via API ==="
          for file in rules/*.xml; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              echo "Uploading $FILENAME..."

              # Upload & overwrite rules directly in /var/ossec/etc/rules/
              RESPONSE=$(curl -k -s -X POST "https://${HOST}:55000/rules/files/${FILENAME}?overwrite=true" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/xml" \
                --data-binary "@${file}")

              echo "Upload Response: $RESPONSE"

              if echo "$RESPONSE" | grep -q '"error":[^0]'; then
                echo "::error::Failed to upload $FILENAME! Check XML syntax or API permissions."
                exit 1
              fi
            fi
          done

          echo "=== 4. Restarting Wazuh Manager via API ==="
          RESTART_RESP=$(curl -k -s -X PUT "https://${HOST}:55000/manager/restart" \
            -H "Authorization: Bearer ${TOKEN}")
          echo "Restart Response: $RESTART_RESP"

          echo "=== 5. Health Check: Verifying Manager Status ==="
          echo "Waiting 15 seconds for daemons to initialize..."
          sleep 15

          STATUS_RESP=$(curl -k -s -X GET "https://${HOST}:55000/manager/status" \
            -H "Authorization: Bearer ${TOKEN}")
          echo "Manager Health Status: $STATUS_RESP"

          if echo "$STATUS_RESP" | grep -q '"error":0'; then
            echo "SUCCESS: Rules updated, Manager restarted, and system is fully operational!"
          else
            echo "::error::Health check failed! Restoring backup..."
            
            # Rollback: Upload backup file back to server
            curl -k -s -X POST "https://${HOST}:55000/rules/files/local_rules.xml?overwrite=true" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/xml" \
              --data-binary "@temp_backup/local_rules_backup.xml"

            # Restart Manager again
            curl -k -s -X PUT "https://${HOST}:55000/manager/restart" \
              -H "Authorization: Bearer ${TOKEN}"
            
            exit 1
          fi
