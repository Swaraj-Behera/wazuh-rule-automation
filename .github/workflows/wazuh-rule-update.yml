name: Wazuh Rule Automation

on:
  push:
    paths:
      - 'rules/**/*.xml'
      - 'rules/**/*.json'
  workflow_dispatch:
    inputs:
      rule_file:
        description: 'Rule file name'
        required: true
        default: 'custom_rules.xml'

env:
  WAZUH_HOST: ${{ secrets.WAZUH_HOST }}
  WAZUH_USER: ${{ secrets.WAZUH_USER }}
  WAZUH_PASSWORD: ${{ secrets.WAZUH_PASSWORD }}
  WAZUH_PORT: ${{ secrets.WAZUH_PORT || '55000' }}

jobs:
  rule-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml paramiko pytest
    
    - name: Create backup directory
      run: |
        mkdir -p backups
        echo "BACKUP_DIR=$(pwd)/backups" >> $GITHUB_ENV
        
    - name: Run Wazuh Rule Update
      run: |
        python scripts/update_rules.py \
          --host ${{ env.WAZUH_HOST }} \
          --user ${{ env.WAZUH_USER }} \
          --password ${{ env.WAZUH_PASSWORD }} \
          --port ${{ env.WAZUH_PORT }} \
          --rule-file rules/custom_rules.xml \
          --backup-dir ${{ env.BACKUP_DIR }}
    
    - name: Verify Wazuh Status
      run: |
        python scripts/verify_wazuh.py \
          --host ${{ env.WAZUH_HOST }} \
          --port ${{ env.WAZUH_PORT }}
    
    - name: Upload backup artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rule-backups-${{ github.run_id }}
        path: backups/
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: update-logs-${{ github.run_id }}
        path: |
          *.log
          backup_*.txt
