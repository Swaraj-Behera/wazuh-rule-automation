name: Wazuh Rule Automation - API Only

on:
  push:
    paths:
      - 'rules/**/*.xml'
      - 'rules/**/*.json'
  workflow_dispatch:
    inputs:
      rule_file:
        description: 'Rule file path'
        required: false
        default: 'rules/custom_rules.xml'
      rollback:
        description: 'Rollback to previous version'
        required: false
        type: boolean
        default: false
      test_only:
        description: 'Test API connection only'
        required: false
        type: boolean
        default: false

env:
  WAZUH_HOST: ${{ secrets.WAZUH_HOST }}
  WAZUH_USER: ${{ secrets.WAZUH_USER }}
  WAZUH_PASSWORD: ${{ secrets.WAZUH_PASSWORD }}
  WAZUH_PORT: ${{ secrets.WAZUH_PORT || '55000' }}

jobs:
  wazuh-rule-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Create backup directory
      run: mkdir -p backups
    
    - name: Test Wazuh API Connection
      if: github.event.inputs.test_only == 'true'
      run: |
        python scripts/update_rules.py \
          --host ${{ env.WAZUH_HOST }} \
          --port ${{ env.WAZUH_PORT }} \
          --user ${{ env.WAZUH_USER }} \
          --password ${{ env.WAZUH_PASSWORD }} \
          --rule-file ${{ github.event.inputs.rule_file || 'rules/custom_rules.xml' }} \
          --test-only
    
    - name: Run Wazuh Rule Update
      if: github.event.inputs.test_only != 'true'
      run: |
        python scripts/update_rules.py \
          --host ${{ env.WAZUH_HOST }} \
          --port ${{ env.WAZUH_PORT }} \
          --user ${{ env.WAZUH_USER }} \
          --password ${{ env.WAZUH_PASSWORD }} \
          --rule-file ${{ github.event.inputs.rule_file || 'rules/custom_rules.xml' }} \
          --backup-dir ./backups \
          ${{ github.event.inputs.rollback == 'true' && '--rollback' || '' }}
    
    - name: Verify Wazuh Status
      if: always()
      run: |
        python scripts/verify_wazuh.py \
          --host ${{ env.WAZUH_HOST }} \
          --port ${{ env.WAZUH_PORT }} \
          --user ${{ env.WAZUH_USER }} \
          --password ${{ env.WAZUH_PASSWORD }}
    
    - name: Upload backup artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: wazuh-backups-${{ github.run_id }}
        path: backups/
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: wazuh-logs-${{ github.run_id }}
        path: |
          *.log
          *.json
    
    - name: Upload verification report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: wazuh-verification-${{ github.run_id }}
        path: |
          verify_*.log
          status_*.json
