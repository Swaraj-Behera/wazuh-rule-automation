name: Wazuh Rule Automation

on:
  push:
    paths:
      - 'rules/**/*.xml'
      - 'rules/**/*.json'
  workflow_dispatch:
    inputs:
      rule_file:
        description: 'Rule file name'
        required: true
        default: 'custom_rules.xml'
      rollback:
        description: 'Rollback to previous version'
        required: false
        type: boolean
        default: false

env:
  WAZUH_HOST: ${{ secrets.WAZUH_HOST }}
  WAZUH_USER: ${{ secrets.WAZUH_USER }}
  WAZUH_PASSWORD: ${{ secrets.WAZUH_PASSWORD }}
  WAZUH_PORT: ${{ secrets.WAZUH_PORT || '55000' }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  rule-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml paramiko pytest
    
    - name: Create backup directory
      run: |
        mkdir -p backups
        echo "BACKUP_DIR=$(pwd)/backups" >> $GITHUB_ENV
    
    - name: Setup SSH key (if provided)
      if: env.SSH_PRIVATE_KEY != ''
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ env.WAZUH_HOST }} >> ~/.ssh/known_hosts
    
    - name: Run Wazuh Rule Update
      run: |
        python scripts/update_rules.py \
          --host ${{ env.WAZUH_HOST }} \
          --user ${{ env.WAZUH_USER }} \
          --password ${{ env.WAZUH_PASSWORD }} \
          --port ${{ env.WAZUH_PORT }} \
          --rule-file ${{ github.event.inputs.rule_file || 'rules/custom_rules.xml' }} \
          --backup-dir ${{ env.BACKUP_DIR }} \
          ${{ github.event.inputs.rollback == 'true' && '--rollback' || '' }} \
          ${{ env.SSH_PRIVATE_KEY != '' && '--ssh-key ~/.ssh/id_rsa' || '' }}
    
    - name: Verify Wazuh Status
      run: |
        python scripts/verify_wazuh.py \
          --host ${{ env.WAZUH_HOST }} \
          --port ${{ env.WAZUH_PORT }}
    
    - name: Upload backup artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rule-backups-${{ github.run_id }}
        path: backups/
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: update-logs-${{ github.run_id }}
        path: |
          *.log
          *.json
          backup_*.txt
    
    - name: Upload summary report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: update-summary-${{ github.run_id }}
        path: update_summary_*.json
    
    - name: Send notification (optional)
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ Wazuh rule update completed successfully!"
        else
          echo "❌ Wazuh rule update failed!"
          # Add your notification logic here (e.g., Slack, email)
        fi
